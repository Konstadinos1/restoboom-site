name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck · unit · E2E · a11y · links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function — type-check + tests against a fake PostgREST
        run: npm run test:edge
      - name: Build (E2E endpoints, intercepted by Playwright)
        run: npm run build:e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - run: npm run linkcheck
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets (perf ≥ 90, a11y 100, SEO ≥ 95)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          # The directory is dot-prefixed: upload-artifact@v4 skips hidden paths unless told otherwise.
          include-hidden-files: true
          retention-days: 14
