<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page introuvable — RestoBoom</title>
    <link rel="icon" href="/restoboom-site/favicon.svg" type="image/svg+xml" />
    <style>
      body { background: #06080b; color: #e9f0f5; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center;
        background-image: radial-gradient(40% 50% at 70% 40%, rgba(255,90,54,.18), transparent 70%), radial-gradient(60% 70% at 70% 45%, rgba(93,137,168,.14), transparent 72%); }
      .wrap { max-width: 42rem; padding: 4rem 1.5rem; }
      .kicker { font-family: ui-monospace, monospace; font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; color: #bcd3e3; }
      .code { font-family: ui-monospace, monospace; font-size: clamp(4rem, 16vw, 9rem); font-weight: 700; letter-spacing: -.05em; line-height: 1; margin: 1rem 0 .5rem; color: #ff5a36; }
      h1 { font-size: clamp(1.8rem, 5vw, 3rem); line-height: 1.05; letter-spacing: -.03em; margin: 0 0 1rem; }
      p { color: #8d9aa6; line-height: 1.6; }
      .row { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 2rem; }
      a { color: #e9f0f5; }
      .btn { display: inline-block; padding: .9rem 1.5rem; border-radius: 999px; text-decoration: none; font-weight: 600; }
      .primary { background: #ff5a36; color: #0b0705; }
      .ghost { border: 1px solid rgba(188,211,227,.28); }
      a:focus-visible { outline: 2px solid #ff5a36; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <p class="kicker">RestoBoom · Erreur / Error</p>
      <p class="code" aria-hidden="true">404</p>
      <h1>Cette page a changé d'adresse.</h1>
      <p>La page que vous cherchez n'existe pas (ou plus). <span lang="en">This page doesn't exist (anymore).</span></p>
      <div class="row">
        <a class="btn primary" href="/restoboom-site/">Retour à l'accueil</a>
        <a class="btn ghost" href="/restoboom-site/diagnostic/">Diagnostic gratuit</a>
        <a class="btn ghost" href="/restoboom-site/en/" lang="en">English</a>
      </div>
    </main>
  </body>
</html>
